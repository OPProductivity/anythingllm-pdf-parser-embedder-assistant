[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anythingllm-pdf-assistant"
version = "0.5.1"
description = "Local PDF-to-text, OCR, page-aware chunking, and AnythingLLM Desktop upload assistant"
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = [
  "anythingllm",
  "pdf",
  "pdf-to-text",
  "ocr",
  "rag",
  "document-ingestion",
  "page-aware-retrieval",
  "embeddings",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
]
dependencies = [
  "gradio==6.19.0",
  "PyMuPDF==1.27.2.3",
  "pymupdf4llm==1.27.2.3",
  "unstructured[pdf]==0.18.32",
  "unstructured-inference==1.2.0",
  "lancedb==0.33.0",
  "pyarrow==24.0.0",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "pillow==12.3.0",
  "pi-heif==1.4.0",
  "pydantic==2.13.4",
  "requests==2.34.2",
]

[project.scripts]
anythingllm-pdf-assistant = "anythingllm_pdf_assistant_cli:main"

[project.urls]
Homepage = "https://github.com/OPProductivity/anythingllm-pdf-parser-embedder-assistant"
Documentation = "https://github.com/OPProductivity/anythingllm-pdf-parser-embedder-assistant#readme"
Source = "https://github.com/OPProductivity/anythingllm-pdf-parser-embedder-assistant"
Issues = "https://github.com/OPProductivity/anythingllm-pdf-parser-embedder-assistant/issues"

[tool.setuptools]
packages = ["benchmarks"]
py-modules = [
  "anythingllm_compatibility",
  "anythingllm_pdf_assistant_cli",
  "anythingllm_persistence",
  "anythingllm_state",
  "auto_anythingllm_pipeline",
  "cancellable_preparation_worker",
  "embedder_capabilities",
  "orchestration",
  "portable_paths",
  "post_upload_polling",
  "preflight",
  "rag_pdf_gradio_app",
  "rag_pdf_tools",
  "run_control",
  "run_request",
  "segmentation_policy",
  "semantic_segmentation",
  "structured_logging",
  "validation_contract",
]

[tool.setuptools.package-data]
benchmarks = ["*.json"]

[tool.setuptools.data-files]
"share/anythingllm-pdf-assistant" = ["Install-AnythingLLMDesktopRefreshBridge.ps1", "Install-AnythingLLMPdfAssistant.ps1", "VERSION"]
"share/anythingllm-pdf-assistant/assets" = ["assets/pdf-icon.svg", "assets/anythingllm-pdf-assistant-start.ico", "assets/anythingllm-pdf-assistant-stop.ico"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["tmp", "tmp-output", ".venv", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = [
  "anythingllm_compatibility",
  "anythingllm_persistence",
  "anythingllm_state",
  "auto_anythingllm_pipeline",
  "orchestration",
  "post_upload_polling",
  "preflight",
  "rag_pdf_gradio_app",
  "rag_pdf_tools",
  "run_control",
  "run_request",
  "segmentation_policy",
  "semantic_segmentation",
  "structured_logging",
  "validation_contract",
]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 63
precision = 1
skip_empty = true
show_missing = true
