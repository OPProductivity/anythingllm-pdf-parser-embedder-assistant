[pytest]
testpaths = tests
markers =
    offline_deterministic: no external services, persistent state, or paid providers
    local_live_readonly: reads a live local AnythingLLM/Ollama installation without mutation
    local_live_mutating: mutates a live local AnythingLLM installation
    provider_paid: can call a paid remote provider
    ui_local: launches an isolated local Gradio server and controls it through Playwright
    desktop_bridge: requires a running AnythingLLM Desktop bridge and may request a guarded sidebar refresh
addopts = -m offline_deterministic
filterwarnings =
    # Unstructured 0.18.32 decorates PDF helpers with an asyncio alias that
    # Python 3.14 deprecates. The application installs an import-time
    # compatibility bridge; retain this precise filter for direct dependency
    # imports in tests until upstream replaces the alias.
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning:unstructured\.utils
