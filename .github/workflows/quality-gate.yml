name: Deterministic quality gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    name: Offline regression gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Ruff
        run: python -m ruff check --force-exclude .
      - name: Core type checks
        run: python -m pyright --pythonplatform Windows
      - name: Install pinned OCR test dependency
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.0.20241111 --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Tesseract installation failed' }
          $taskOcr = Join-Path $env:ProgramFiles 'Tesseract-OCR/tesseract.exe'
          if (-not (Test-Path -LiteralPath $taskOcr)) { throw 'Tesseract executable missing' }
          $taskVersion = & $taskOcr --version
          if ($LASTEXITCODE -ne 0 -or $taskVersion[0] -ne 'tesseract v5.5.0.20241111') {
            throw 'Unexpected OCR engine version'
          }
          $taskVersion | Write-Output
          $taskLanguages = & $taskOcr --list-langs
          if ($LASTEXITCODE -ne 0 -or $taskLanguages -notcontains 'eng') {
            throw 'English OCR language data missing'
          }
          $taskLanguages | Write-Output
          Split-Path -Parent $taskOcr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Offline deterministic tests
        run: python -m pytest -m offline_deterministic -q
      - name: Tracked-file secret scan
        shell: bash
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

# Live AnythingLLM/Desktop, browser, and paid-provider acceptance are intentionally
# excluded: each needs local mutable state or explicit owner authorization.
